<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Dashboard</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <h1>Dashboard</h1>
        <p>Welcome, {% raw %}{{ user ? user.username : 'Loading...' }}{% endraw %}</p>
        <p>Notes: {% raw %}{{ notes.length }}{% endraw %}</p>

        <div v-if="loading">Loading...</div>
        <div v-else>
            <button @click="createNote" class="btn">+ New Note</button>

            <div v-for="note in notes" :key="note.id" style="border: 1px solid #ccc; margin: 10px; padding: 10px;">
                <h3>{% raw %}{{ note.title }}{% endraw %}</h3>
                <p>{% raw %}{{ note.content.substring(0, 100) }}{% endraw %}...</p>
                <small>{% raw %}{{ formatDate(note.updated_at) }}{% endraw %}</small>
                <button @click="deleteNote(note.id)" style="color: red;">Delete</button>
            </div>
        </div>

        <button @click="logout" style="background: red; color: white;">Logout</button>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    user: {{ user.username|tojson if user else 'null' }},
                    notes: {{ notes|tojson }},
                    loading: false
                }
            },

            methods: {
                async createNote() {
                    try {
                        const response = await fetch('/api/notes', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify({
                                title: 'New Note',
                                content: '<p>Start writing...</p>'
                            })
                        });

                        if (response.ok) {
                            const data = await response.json();
                            this.notes.unshift(data.note);
                            alert('Note created!');
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        alert('Failed to create note');
                    }
                },

                async deleteNote(noteId) {
                    if (!confirm('Delete this note?')) return;

                    try {
                        const response = await fetch(`/api/notes/${noteId}`, {
                            method: 'DELETE',
                            credentials: 'include'
                        });

                        if (response.ok) {
                            this.notes = this.notes.filter(n => n.id !== noteId);
                            alert('Note deleted!');
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        alert('Failed to delete note');
                    }
                },

                formatDate(dateString) {
                    return new Date(dateString).toLocaleDateString();
                },

                async logout() {
                    window.location.href = '/logout';
                }
            }
        }).mount('#app');
    </script>

    <style>
        .btn {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
        }

        .btn:hover {
            background: #0056b3;
        }
    </style>
</body>
</html>
