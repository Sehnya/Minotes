<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/@tiptap/core@2.1.13/dist/index.umd.js"></script>
    <script src="https://unpkg.com/@tiptap/starter-kit@2.1.13/dist/index.umd.js"></script>
    <script src="https://unpkg.com/@tiptap/extension-placeholder@2.1.13/dist/index.umd.js"></script>
    <link rel="stylesheet" href="https://use.typekit.net/obl2cdx.css">
    <style>
        :root {
            --bg-primary: #FEFCF8;
            --bg-secondary: #F8F4EE;
            --bg-tertiary: #F2EDE5;
            --accent-warm: #E8B4A0;
            --accent-sage: #9CAF88;
            --accent-cream: #F5E6D3;
            --accent-rose: #D4A574;
            --text-primary: #2C2825;
            --text-secondary: #5D5A54;
            --text-tertiary: #8B8680;
            --text-light: #A8A39E;
            --border-light: #E8E3DD;
            --border-medium: #D4CFC7;
            --shadow-soft: rgba(44, 40, 37, 0.08);
            --shadow-medium: rgba(44, 40, 37, 0.12);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: ff-providence-sans-web-pro, sans-serif;
            font-weight: 400;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* App Layout */
        .app-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .sidebar-header {
            padding: 24px 20px 20px;
            border-bottom: 1px solid var(--border-light);
            background: var(--bg-primary);
        }

        .app-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-info {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--accent-cream);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            display: inline-block;
        }

        .sidebar-actions {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-light);
        }

        .new-note-btn {
            width: 100%;
            padding: 12px 16px;
            background: var(--accent-sage);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .new-note-btn:hover {
            background: #8BA077;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--shadow-medium);
        }

        .new-note-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Notes List */
        .notes-section {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .notes-header {
            padding: 16px 20px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .notes-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .notes-count {
            font-size: 12px;
            color: var(--text-tertiary);
            background: var(--bg-tertiary);
            padding: 4px 8px;
            border-radius: var(--radius-sm);
        }

        .notes-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px 20px;
        }

        .notes-list::-webkit-scrollbar {
            width: 4px;
        }

        .notes-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .notes-list::-webkit-scrollbar-thumb {
            background: var(--border-medium);
            border-radius: 2px;
        }

        .note-item {
            padding: 12px 16px;
            margin-bottom: 4px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            group: hover;
        }

        .note-item:hover {
            background: var(--bg-tertiary);
        }

        .note-item.active {
            background: var(--accent-cream);
            box-shadow: 0 2px 8px var(--shadow-soft);
        }

        .note-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-preview {
            font-size: 12px;
            color: var(--text-tertiary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 6px;
        }

        .note-date {
            font-size: 11px;
            color: var(--text-light);
        }

        .note-delete {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 20px;
            height: 20px;
            border: none;
            background: var(--accent-warm);
            color: white;
            border-radius: 50%;
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .note-item:hover .note-delete {
            opacity: 1;
        }

        .note-delete:hover {
            background: #E0A088;
            transform: scale(1.1);
        }

        /* Empty State */
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-tertiary);
        }

        .empty-state-icon {
            font-size: 32px;
            margin-bottom: 12px;
            opacity: 0.6;
        }

        .empty-state h3 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .empty-state p {
            font-size: 13px;
            margin-bottom: 20px;
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }

        /* Top Bar */
        .top-bar {
            padding: 16px 32px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-primary);
        }

        .editor-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .word-count {
            font-size: 12px;
            color: var(--text-tertiary);
            background: var(--bg-secondary);
            padding: 4px 8px;
            border-radius: var(--radius-sm);
        }

        .save-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-sage);
        }

        .status-dot.saving {
            background: var(--accent-rose);
            animation: pulse 1.5s infinite;
        }

        .status-dot.error {
            background: var(--accent-warm);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .top-bar-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            border: 1px solid var(--border-medium);
            background: var(--bg-primary);
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn:hover {
            background: var(--bg-secondary);
            border-color: var(--border-medium);
        }

        .btn-primary {
            background: var(--accent-sage);
            color: white;
            border-color: var(--accent-sage);
        }

        .btn-primary:hover {
            background: #8BA077;
        }

        .btn-danger {
            background: var(--accent-warm);
            color: white;
            border-color: var(--accent-warm);
        }

        .btn-danger:hover {
            background: #E0A088;
        }

        /* Editor Container */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            padding: 0 32px;
        }

        /* Title Input */
        .title-section {
            padding: 32px 0 16px;
        }

        .title-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            font-family: inherit;
            line-height: 1.2;
            resize: none;
            outline: none;
        }

        .title-input::placeholder {
            color: var(--text-light);
        }

        /* Toolbar */
        .toolbar {
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 24px;
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            padding: 6px 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .toolbar-btn:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .toolbar-btn.is-active {
            background: var(--accent-cream);
            color: var(--text-primary);
            border-color: var(--border-medium);
        }

        /* Editor */
        .editor-content {
            flex: 1;
            padding-bottom: 100px;
        }

        .ProseMirror {
            outline: none;
            font-size: 16px;
            line-height: 1.7;
            color: var(--text-primary);
            font-family: inherit;
        }

        .ProseMirror p {
            margin-bottom: 16px;
        }

        .ProseMirror p.is-editor-empty:first-child::before {
            content: attr(data-placeholder);
            float: left;
            color: var(--text-light);
            pointer-events: none;
            height: 0;
        }

        .ProseMirror h1, .ProseMirror h2, .ProseMirror h3 {
            margin-top: 32px;
            margin-bottom: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .ProseMirror h1 {
            font-size: 2em;
        }

        .ProseMirror h2 {
            font-size: 1.5em;
        }

        .ProseMirror h3 {
            font-size: 1.25em;
        }

        .ProseMirror ul, .ProseMirror ol {
            padding-left: 24px;
            margin-bottom: 16px;
        }

        .ProseMirror blockquote {
            border-left: 3px solid var(--accent-sage);
            padding-left: 16px;
            margin: 20px 0;
            color: var(--text-secondary);
            font-style: italic;
        }

        .ProseMirror strong {
            font-weight: 600;
        }

        .ProseMirror code {
            background: var(--bg-secondary);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 0.9em;
            color: var(--text-primary);
        }

        .ProseMirror pre {
            background: var(--bg-secondary);
            padding: 16px;
            border-radius: var(--radius-md);
            overflow-x: auto;
            margin: 20px 0;
            border: 1px solid var(--border-light);
        }

        .ProseMirror pre code {
            background: none;
            padding: 0;
        }

        /* Loading State */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            color: var(--text-tertiary);
            font-size: 14px;
        }

        /* Alert */
        .alert {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            box-shadow: 0 8px 32px var(--shadow-medium);
            z-index: 9999;
            max-width: 300px;
            font-size: 13px;
            font-weight: 500;
            animation: slideIn 0.3s ease;
        }

        .alert-success {
            background: var(--accent-sage);
            color: white;
        }

        .alert-error {
            background: var(--accent-warm);
            color: white;
        }

        .alert-warning {
            background: var(--accent-rose);
            color: white;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: 300px;
                order: 2;
            }

            .main-content {
                order: 1;
            }

            .editor-container {
                padding: 0 20px;
            }

            .title-input {
                font-size: 24px;
            }

            .top-bar {
                padding: 12px 20px;
            }
        }

        /* Sidebar toggle for mobile */
        .sidebar-toggle {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: var(--accent-sage);
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--shadow-medium);
        }

        @media (max-width: 768px) {
            .sidebar-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                height: 100vh;
                z-index: 999;
                transition: left 0.3s ease;
                max-height: none;
            }

            .sidebar.open {
                left: 0;
            }

            .sidebar-overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.5);
                z-index: 998;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s ease;
            }

            .sidebar-overlay.open {
                opacity: 1;
                pointer-events: all;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="app-container">
            <!-- Mobile Sidebar Toggle -->
            <button class="sidebar-toggle" @click="toggleSidebar">
                ☰
            </button>

            <!-- Sidebar Overlay for Mobile -->
            <div :class="['sidebar-overlay', { open: sidebarOpen }]" @click="closeSidebar"></div>

            <!-- Sidebar -->
            <div :class="['sidebar', { open: sidebarOpen }]">
                <div class="sidebar-header">
                    <div class="app-title">
                        <span>📝</span>
                        Notes
                    </div>
                    <div class="user-info" v-if="user">
                        {{ user.username }}
                    </div>
                </div>

                <div class="sidebar-actions">
                    <button @click="createNewNote" class="new-note-btn" :disabled="loading">
                        <span>+</span>
                        New Note
                    </button>
                </div>

                <div class="notes-section">
                    <div class="notes-header">
                        <div class="notes-title">Recent</div>
                        <div class="notes-count">{{ notes.length }}</div>
                    </div>

                    <div class="notes-list">
                        <div v-if="loading && notes.length === 0" class="loading">
                            Loading notes...
                        </div>
                        <div v-else-if="notes.length === 0" class="empty-state">
                            <div class="empty-state-icon">📄</div>
                            <h3>No notes yet</h3>
                            <p>Create your first note to get started</p>
                            <button class="new-note-btn" @click="createNewNote">
                                <span>+</span>
                                Create Note
                            </button>
                        </div>
                        <div v-else>
                            <div
                                v-for="note in notes"
                                :key="note.id"
                                :class="['note-item', { active: currentNote && currentNote.id === note.id }]"
                                @click="loadNote(note)"
                            >
                                <div class="note-title">{{ note.title || 'Untitled' }}</div>
                                <div class="note-preview">{{ getPreview(note.content) }}</div>
                                <div class="note-date">{{ formatDate(note.updated_at) }}</div>
                                <button
                                    class="note-delete"
                                    @click.stop="deleteNote(note.id)"
                                    title="Delete note"
                                >
                                    ×
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <!-- Top Bar -->
                <div class="top-bar">
                    <div class="editor-info">
                        <div class="word-count">{{ wordCount }} words</div>
                        <div class="save-status">
                            <div :class="['status-dot', saveStatus]"></div>
                            <span v-if="saveStatus === 'saved'">Saved</span>
                            <span v-else-if="saveStatus === 'saving'">Saving...</span>
                            <span v-else-if="saveStatus === 'error'">Error</span>
                            <span v-else>Ready</span>
                        </div>
                    </div>
                    <div class="top-bar-actions">
                        <button @click="saveNote" class="btn btn-primary" :disabled="loading || !hasChanges">
                            {{ saving ? 'Saving...' : 'Save' }}
                        </button>
                        <button @click="logout" class="btn btn-danger">
                            Logout
                        </button>
                    </div>
                </div>

                <!-- Editor Container -->
                <div class="editor-container">
                    <!-- Title Section -->
                    <div class="title-section">
                        <textarea
                            v-model="currentTitle"
                            @input="onTitleChange"
                            class="title-input"
                            placeholder="Untitled"
                            rows="1"
                            @keydown="handleTitleKeydown"
                        ></textarea>
                    </div>

                    <!-- Toolbar -->
                    <div class="toolbar" v-if="editor">
                        <button
                            @click="editor.chain().focus().toggleBold().run()"
                            :class="['toolbar-btn', { 'is-active': editor.isActive('bold') }]"
                        >
                            B
                        </button>
                        <button
                            @click="editor.chain().focus().toggleItalic().run()"
                            :class="['toolbar-btn', { 'is-active': editor.isActive('italic') }]"
                        >
                            I
                        </button>
                        <button
                            @click="editor.chain().focus().toggleStrike().run()"
                            :class="['toolbar-btn', { 'is-active': editor.isActive('strike') }]"
                        >
                            S
                        </button>
                        <button
                            @click="editor.chain().focus().toggleHeading({ level: 1 }).run()"
                            :class="['toolbar-btn', { 'is-active': editor.isActive('heading', { level: 1 }) }]"
                        >
                            H1
                        </button>
                        <button
                            @click="editor.chain().focus().toggleHeading({ level: 2 }).run()"
                            :class="['toolbar-btn', { 'is-active': editor.isActive('heading', { level: 2 }) }]"
                        >
                            H2
                        </button>
                        <button
                            @click="editor.chain().focus().toggleHeading({ level: 3 }).run()"
                            :class="['toolbar-btn', { 'is-active': editor.isActive('heading', { level: 3 }) }]"
                        >
                            H3
                        </button>
                        <button
                            @click="editor.chain().focus().toggleBulletList().run()"
                            :class="['toolbar-btn', { 'is-active': editor.isActive('bulletList') }]"
                        >
                            • List
                        </button>
                        <button
                            @click="editor.chain().focus().toggleOrderedList().run()"
                            :class="['toolbar-btn', { 'is-active': editor.isActive('orderedList') }]"
                        >
                            1. List
                        </button>
                        <button
                            @click="editor.chain().focus().toggleBlockquote().run()"
                            :class="['toolbar-btn', { 'is-active': editor.isActive('blockquote') }]"
                        >
                            Quote
                        </button>
                        <button
                            @click="editor.chain().focus().toggleCode().run()"
                            :class="['toolbar-btn', { 'is-active': editor.isActive('code') }]"
                        >
                            Code
                        </button>
                    </div>

                    <!-- Editor Content -->
                    <div class="editor-content">
                        <div ref="editor"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Alert Component -->
        <div v-if="alert.show" :class="['alert', `alert-${alert.type}`]">
            {{ alert.message }}
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        const { Editor } = Tiptap;
        const { StarterKit } = TiptapStarterKit;
        const { Placeholder } = TiptapPlaceholder;

        createApp({
            data() {
                return {
                    user: null,
                    notes: [],
                    currentNote: null,
                    currentTitle: '',
                    currentContent: '',
                    editor: null,
                    loading: false,
                    saving: false,
                    hasChanges: false,
                    saveStatus: 'ready',
                    wordCount: 0,
                    sidebarOpen: false,
                    alert: {
                        show: false,
                        message: '',
                        type: 'success'
                    },
                    saveTimeout: null
                }
            },

            async mounted() {
                await this.checkSession();
                await this.loadNotes();
                this.initEditor();

                // Auto-save interval
                setInterval(() => {
                    if (this.hasChanges && !this.saving) {
                        this.saveNote();
                    }
                }, 30000);

                // Auto-resize title textarea
                this.$nextTick(() => {
                    this.autoResizeTitle();
                });
            },

            beforeUnmount() {
                if (this.editor) {
                    this.editor.destroy();
                }
            },

            methods: {
                initEditor() {
                    this.editor = new Editor({
                        element: this.$refs.editor,
                        extensions: [
                            StarterKit,
                            Placeholder.configure({
                                placeholder: 'Start writing...'
                            })
                        ],
                        content: this.currentContent,
                        onUpdate: ({ editor }) => {
                            this.currentContent = editor.getHTML();
                            this.wordCount = editor.getText().split(/\s+/).filter(word => word.length > 0).length;
                            this.onContentChange();
                        }
                    });
                },

                handleTitleKeydown(event) {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        this.editor.commands.focus();
                    }
                    this.$nextTick(() => {
                        this.autoResizeTitle();
                    });
                },

                autoResizeTitle() {
                    const textarea = document.querySelector('.title-input');
                    if (textarea) {
                        textarea.style.height = 'auto';
                        textarea.style.height = textarea.scrollHeight + 'px';
                    }
                },

                toggleSidebar() {
                    this.sidebarOpen = !this.sidebarOpen;
                },

                closeSidebar() {
                    this.sidebarOpen = false;
                },

                async checkSession() {
                    try {
                        const response = await fetch('/api/session', {
                            credentials: 'include'
                        });

                        if (response.ok) {
                            const data = await response.json();
                            if (data.logged_in) {
                                this.user = data;
                            } else {
                                window.location.href = '/login';
                            }
                        } else {
                            window.location.href = '/login';
                        }
                    } catch (error) {
                        console.error('Session check failed:', error);
                        window.location.href = '/login';
                    }
                },

                async loadNotes() {
                    this.loading = true;
                    try {
                        const response = await fetch('/api/notes', {
                            credentials: 'include'
                        });

                        if (response.ok) {
                            const data = await response.json();
                            this.notes = data.notes;

                            if (this.notes.length > 0 && !this.currentNote) {
                                this.loadNote(this.notes[0]);
                            }
                        } else {
                            this.showAlert('Failed to load notes', 'error');
                        }
                    } catch (error) {
                        console.error('Failed to load notes:', error);
                        this.showAlert('Failed to load notes', 'error');
                    } finally {
                        this.loading = false;
                    }
                },

                loadNote(note) {
                    if (this.hasChanges) {
                        if (!confirm('You have unsaved changes. Continue without saving?')) {
                            return;

                        }
                    }

                    this.currentNote = note;
                    this.currentTitle = note.title;
                    this.currentContent = note.content;

                    if (this.editor) {
                        this.editor.commands.setContent(note.content);
                        this.wordCount = this.editor.getText().split(/\s+/).filter(word => word.length > 0).length;
                    }

                    this.hasChanges = false;
                    this.saveStatus = 'ready';

                    // Auto-resize title
                    this.$nextTick(() => {
                        this.autoResizeTitle();
                    });

                    // Close sidebar on mobile after selecting note
                    if (window.innerWidth <= 768) {
                        this.closeSidebar();
                    }
                },

                async createNewNote() {
                    if (this.hasChanges) {
                        if (!confirm('You have unsaved changes. Continue without saving?')) {
                            return;
                        }
                    }

                    const newNote = {
                        title: 'Untitled',
                        content: '<p></p>'
                    };

                    try {
                        const response = await fetch('/api/notes', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            credentials: 'include',
                            body: JSON.stringify(newNote)
                        });

                        if (response.ok) {
                            const data = await response.json();
                            this.notes.unshift(data.note);
                            this.loadNote(data.note);
                            this.showAlert('New note created', 'success');

                            // Focus on title input
                            this.$nextTick(() => {
                                const titleInput = document.querySelector('.title-input');
                                if (titleInput) {
                                    titleInput.focus();
                                    titleInput.select();
                                }
                            });
                        } else {
                            this.showAlert('Failed to create note', 'error');
                        }
                    } catch (error) {
                        console.error('Failed to create note:', error);
                        this.showAlert('Failed to create note', 'error');
                    }
                },

                async saveNote() {
                    if (!this.currentNote || this.saving) return;

                    this.saving = true;
                    this.saveStatus = 'saving';

                    try {
                        const response = await fetch(`/api/notes/${this.currentNote.id}`, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            credentials: 'include',
                            body: JSON.stringify({
                                title: this.currentTitle || 'Untitled',
                                content: this.currentContent
                            })
                        });

                        if (response.ok) {
                            const data = await response.json();

                            // Update the note in the list
                            const noteIndex = this.notes.findIndex(n => n.id === this.currentNote.id);
                            if (noteIndex !== -1) {
                                this.notes[noteIndex] = data.note;
                                this.currentNote = data.note;
                            }

                            this.hasChanges = false;
                            this.saveStatus = 'saved';

                            // Reset status after 2 seconds
                            setTimeout(() => {
                                if (this.saveStatus === 'saved') {
                                    this.saveStatus = 'ready';
                                }
                            }, 2000);

                        } else {
                            this.saveStatus = 'error';
                            this.showAlert('Failed to save note', 'error');
                        }
                    } catch (error) {
                        console.error('Failed to save note:', error);
                        this.saveStatus = 'error';
                        this.showAlert('Failed to save note', 'error');
                    } finally {
                        this.saving = false;
                    }
                },

                async deleteNote(noteId) {
                    if (!confirm('Delete this note? This action cannot be undone.')) {
                        return;
                    }

                    try {
                        const response = await fetch(`/api/notes/${noteId}`, {
                            method: 'DELETE',
                            credentials: 'include'
                        });

                        if (response.ok) {
                            this.notes = this.notes.filter(note => note.id !== noteId);

                            if (this.currentNote && this.currentNote.id === noteId) {
                                if (this.notes.length > 0) {
                                    this.loadNote(this.notes[0]);
                                } else {
                                    this.currentNote = null;
                                    this.currentTitle = '';
                                    this.currentContent = '';
                                    if (this.editor) {
                                        this.editor.commands.setContent('');
                                    }
                                    this.wordCount = 0;
                                }
                            }

                            this.showAlert('Note deleted', 'success');
                        } else {
                            this.showAlert('Failed to delete note', 'error');
                        }
                    } catch (error) {
                        console.error('Failed to delete note:', error);
                        this.showAlert('Failed to delete note', 'error');
                    }
                },

                onTitleChange() {
                    this.hasChanges = true;
                    this.saveStatus = 'ready';
                    this.debouncedSave();
                    this.autoResizeTitle();
                },

                onContentChange() {
                    this.hasChanges = true;
                    this.saveStatus = 'ready';
                    this.debouncedSave();
                },

                debouncedSave() {
                    if (this.saveTimeout) {
                        clearTimeout(this.saveTimeout);
                    }

                    this.saveTimeout = setTimeout(() => {
                        if (this.hasChanges && this.currentNote) {
                            this.saveNote();
                        }
                    }, 2000);
                },

                getPreview(content) {
                    if (!content) return 'No content yet...';

                    const text = content.replace(/<[^>]*>/g, '').trim();
                    return text.length > 80 ? text.substring(0, 80) + '...' : text || 'No content yet...';
                },

                formatDate(dateString) {
                    const date = new Date(dateString);
                    const now = new Date();
                    const diffTime = Math.abs(now - date);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                    if (diffDays === 1) {
                        return 'Today';
                    } else if (diffDays === 2) {
                        return 'Yesterday';
                    } else if (diffDays <= 7) {
                        return `${diffDays - 1} days ago`;
                    } else {
                        return date.toLocaleDateString('en-US', {
                            month: 'short',
                            day: 'numeric',
                            year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined
                        });
                    }
                },

                showAlert(message, type = 'success') {
                    this.alert = {
                        show: true,
                        message,
                        type
                    };

                    setTimeout(() => {
                        this.alert.show = false;
                    }, 4000);
                },

                async logout() {
                    if (this.hasChanges) {
                        if (!confirm('You have unsaved changes. Logout without saving?')) {
                            return;
                        }
                    }

                    try {
                        const response = await fetch('/logout', {
                            method: 'GET',
                            credentials: 'include'
                        });

                        window.location.href = '/login';
                    } catch (error) {
                        console.error('Logout failed:', error);
                        window.location.href = '/login';
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
