<script>
let timeoutId;
let currentNoteId = null;

const textarea = document.getElementById('content');
const saveBtn = document.getElementById('save-btn');
const notesList = document.getElementById('notes-list-container');
const logoutBtn = document.getElementById('logout-btn');
const deleteBtn = document.getElementById('delete-btn');



function showAlert(message) {
  const alertBox = document.createElement('div');
  alertBox.textContent = message;
  alertBox.style.cssText = "background:#cce5ff;padding:10px;margin:10px 0;border-radius:5px;";
  document.body.prepend(alertBox);
  setTimeout(() => alertBox.remove(), 3000);
}
logoutBtn.addEventListener('click', () => {
  sessionStorage.clear();     // Clears all sessionStorage keys
  localStorage.clear();       // Optional: clear localStorage too
  window.location.href = "/logout";  // Let Flask clear the server-side session
});

function fetchNotes() {
  fetch("/api/notes", { credentials: "include" })
    .then(res => res.json())
    .then(data => {
      notesList.innerHTML = "";
      data.notes
        .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))
        .forEach(note => {
          const div = document.createElement("div");

          div.innerHTML = `
            <h3>${note.title}</h3>
            <small>Last updated: ${new Date(note.updated_at).toLocaleString()}</small>
            <p>${note.content}</p>
            <button id="delete-btn" style="justify-self: center;" ">Delete Note</button>
            <hr>
          `;
          notesList.appendChild(div);
        });
    });
}

fetchNotes();

async function deleteNote(noteId, username) {
  const res = await fetch(`/user/${username}/notes/${noteId}`, {
    method: 'DELETE',
    credentials: 'include'
  });

  const data = await res.json();
  if (res.ok) {
    alert(data.message);
    // Optionally refresh the note list
    fetchNotes();
  } else {
    alert(data.error || 'Error deleting note.');
  }
}
deleteBtn.addEventListener('click', deleteNote);
</script>
