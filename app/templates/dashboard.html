<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="stylesheet" href="https://use.typekit.net/tmb0jpk.css">

    <title>Dashboard</title>
  </head>
  <body style="max-width: 100vw; margin: 0 auto; padding: 0; font-family: 'ff-providence-sans-web-pro';">
  <div id="header" style=" display: flex;'flex-wrap'; justify-content: space-between; align-items: center; padding: 20px;">
    <h1 style="position: relative; left: 50%">Dashboard</h1>
      <button id="logout-btn">Log Out</button>
  </div>
  <div id="main" style="grid-area: main; column-count:  2; column-gap: 1px; column-width: 500px; row-gap: 1px; display: flex; text-align: center; margin:0; padding: 0;">

      <div id="main-content" style="justify-content: space-evenly; max-width: 100vw; overflow: auto; position: relative; margin: 0 auto; width: 100%;" >
          <h1 >Create Note</h1>
          <div id="title-container" style="margin-bottom: 5px; margin-top: -13px">
              <input id="title" type="text" name="title" id="title" placeholder="Title" style="height: 3vh; width: 65vw; font-family: 'ff-providence-sans-web-pro';"/>
          </div>
        <div id="editor-container" >
        <div id="editor-header"></div>
         <div id="input-field">
             <textarea id="content" name="note" rows="30" cols="50" style="min-height: 75vh; max-height:75vh;max-width: 65vw; min-width: 65vw; font-family: 'ff-providence-sans-web-pro';">

             </textarea>
         </div>
            <div id="buttons-container" style="justify-self: center; justify-content: space-evenly; width: 400px;">
                <button id="new-note-btn">New Note</button>
             <button id="save-btn">Save Note</button>
            </div>
        </div>
      </div>
    <div id="right-sb" style="width:50%; display: inline-block; position: relative; text-align: center; flex-direction: column; min-width: 350px ">
    <h1 style="position: relative;">Notes</h1>
        <div id="notes-list-container" style="display: flex; flex-direction: column; justify-content: space-around; ">


        </div>
    </div>
</div>
  </body>
</html>
<script>
let timeoutId;
let currentNoteId = null;

const textarea = document.getElementById('content');
const titleInput = document.getElementById('title');
const saveBtn = document.getElementById('save-btn');
const notesList = document.getElementById('notes-list-container');
const logoutBtn = document.getElementById('logout-btn');

function showAlert(message) {
  const alertBox = document.createElement('div');
  alertBox.textContent = message;
  alertBox.style.cssText = "background:#cce5ff;padding:10px;margin:10px 0;border-radius:5px;";
  document.body.prepend(alertBox);
  setTimeout(() => alertBox.remove(), 3000);
}

logoutBtn?.addEventListener('click', () => {
  sessionStorage.clear();
  localStorage.clear();
  window.location.href = "/logout";
});

function saveNote() {
  const title = titleInput.value.trim();
  const content = textarea.value.trim();
  if (!title || !content) return;

  const payload = { title, content };

  const username = sessionStorage.getItem('user');
  const method = currentNoteId ? "PUT" : "POST";
  const url = currentNoteId && username
    ? `/user/${username}/notes/${currentNoteId}`
    : `/save_note`;

  fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify(payload),
  })
    .then(res => res.json())
    .then(data => {
      showAlert(data.message || "Note saved.");
      currentNoteId = data.note_id;
      fetchNotes();
    });
}

function deleteNote(noteId) {
  fetch(`/delete_note/${noteId}`, {
    method: 'DELETE',
    credentials: 'include'
  })
    .then(res => res.json())
    .then(data => {
      showAlert(data.message || "Note deleted.");
      fetchNotes();
    })
    .catch(err => {
      console.error("Delete failed", err);
      showAlert("Error deleting note.");
    });
}

function fetchNotes() {
  fetch("/api/notes", { credentials: "include" })
    .then(res => res.json())
    .then(data => {
      notesList.innerHTML = "";
      data.notes.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))
        .forEach(note => {
          const div = document.createElement("div");
          div.innerHTML = `
            <h3>${note.title}</h3>
            <small>Last updated: ${new Date(note.updated_at).toLocaleString()}</small>
            <p>${note.content}</p>
            <button class="delete-btn" data-id="${note.id}">Delete Note</button>
            <hr>
          `;
          div.dataset.noteId = note.id;

          div.addEventListener("click", (e) => {
            if (e.target.classList.contains("delete-btn")) return; // Avoid conflict
            currentNoteId = note.id;
            titleInput.value = note.title;
            textarea.value = note.content;
          });

          div.querySelector(".delete-btn").addEventListener("click", (e) => {
            e.stopPropagation(); // Prevent parent click
            deleteNote(note.id);
          });

          notesList.appendChild(div);
        });
    })
    .catch(err => {
      console.error("Failed to fetch notes:", err);
    });
}

// Autosave after 5 seconds of inactivity
textarea.addEventListener("input", () => {
  clearTimeout(timeoutId);
  timeoutId = setTimeout(saveNote, 5000);
});
titleInput.addEventListener("input", () => {
  clearTimeout(timeoutId);
  timeoutId = setTimeout(saveNote, 5000);
});

saveBtn.addEventListener("click", saveNote);

// Set username to sessionStorage after login
fetch("/api/session")
  .then(res => res.json())
  .then(data => {
    if (data.logged_in && data.username) {
      sessionStorage.setItem("user", data.username);
      fetchNotes(); // Load notes after confirming session
    } else {
      window.location.href = "/login";
    }
  })
  .catch(err => {
    console.error("Session check failed:", err);
    window.location.href = "/login";
  });
</script>
